<!doctype html>
<!-- WebUI of the gts9wifi Magisk module (KernelSU, APatch, or WebUI X with
     Magisk).  It only runs ../gts9w.sh through the manager's ksu.exec API:
     status, refresh the Android backup, switch to Ubuntu. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ubuntu switch</title>
<style>
:root { --bg: #f6f5f4; --fg: #241f31; --card: #fff; --muted: #5e5c64; --accent: #e95420; --line: #deddda; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #1e1e1e; --fg: #f6f5f4; --card: #2a2a2a; --muted: #b0aeb5; --line: #3d3d3d; }
}
body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--fg);
  font: 16px/1.45 system-ui, sans-serif; }
main { max-width: 560px; margin: 0 auto; }
h1 { font-size: 22px; margin: 0 0 4px; }
p.sub { margin: 0 0 20px; color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px 16px; margin-bottom: 16px; }
.row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row span:first-child { color: var(--muted); }
.row span:last-child { text-align: right; overflow-wrap: anywhere; }
button { width: 100%; padding: 14px; margin-bottom: 10px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--card); color: var(--fg); font-size: 16px; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button:disabled { opacity: .5; }
pre { white-space: pre-wrap; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Ubuntu on the microSD</h1>
  <p class="sub">Galaxy Tab S9 Wi-Fi (SM-X710)</p>
  <div class="card" id="status"><div class="row"><span>Status</span><span>reading…</span></div></div>
  <button class="primary" id="ubuntu">Switch to Ubuntu</button>
  <button id="backup">Refresh Android backup on the card</button>
  <pre id="log"></pre>
</main>
<script>
const SH = 'sh /data/adb/modules/gts9wifi-ubuntu/gts9w.sh';
let n = 0;
function exec(cmd) {
  return new Promise(resolve => {
    if (typeof ksu === 'undefined') { resolve({ errno: 1, stdout: '', stderr: 'No ksu.exec: open this page in KernelSU, APatch or WebUI X.' }); return; }
    const cb = 'gts9w_cb' + (n++);
    window[cb] = (errno, stdout, stderr) => { delete window[cb]; resolve({ errno, stdout, stderr }); };
    ksu.exec(cmd, '{}', cb);
  });
}
const LABELS = { card: 'microSD', partitions: 'Boot partitions', ubuntu: 'Ubuntu boot set', android: 'Android backup',
  android_build: 'Backed-up Android', fingerprint: 'Fingerprint calibration', last_check: 'Last boot check' };
const CARD = { gts9wifi: 'gts9wifi Ubuntu card', none: 'no card', other: 'not a gts9wifi Ubuntu card' };
function row(k, v) {
  const d = document.createElement('div'); d.className = 'row';
  const a = document.createElement('span'); a.textContent = LABELS[k] || k;
  const b = document.createElement('span'); b.textContent = v;
  d.append(a, b); return d;
}
async function refresh() {
  const r = await exec(SH + ' status');
  const box = document.getElementById('status'); box.replaceChildren();
  const kv = {};
  r.stdout.split('\n').forEach(l => { const i = l.indexOf('='); if (i > 0) kv[l.slice(0, i)] = l.slice(i + 1); });
  if (r.errno || !kv.card) { box.append(row('Status', r.stderr || 'unknown')); }
  for (const [k, v] of Object.entries(kv)) box.append(row(k, k === 'card' ? (CARD[v] || v) : v));
  document.getElementById('ubuntu').disabled = !(kv.card === 'gts9wifi' && kv.ubuntu);
}
async function run(cmd, button) {
  const log = document.getElementById('log');
  document.querySelectorAll('button').forEach(b => b.disabled = true);
  log.textContent = button.textContent + '…\n';
  const r = await exec(cmd);
  log.textContent += r.stdout + r.stderr;
  await refresh();
  document.getElementById('backup').disabled = false;
}
document.getElementById('ubuntu').onclick = e => {
  if (confirm('Write the Ubuntu boot images and restart into Ubuntu?')) run(SH + ' ubuntu', e.target);
};
document.getElementById('backup').onclick = e => run(SH + ' backup', e.target);
refresh();
</script>
</body>
</html>
