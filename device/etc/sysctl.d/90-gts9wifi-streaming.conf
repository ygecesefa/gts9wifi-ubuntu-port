# Game streaming (chiaki-ng): a 1080p frame arrives as a burst of UDP packets
# that overflowed the default 208 KiB socket buffer (RcvbufErrors in
# /proc/net/snmp), seen as glitches.  chiaki-ng asks for 4 MiB (its patch
# 0002); the kernel caps that at rmem_max.
net.core.rmem_default = 4194304
net.core.rmem_max = 16777216
