# No proactive memory compaction in the background.
#
# With a game running, memory is tight (game ~2 GB, its GPU memory ~3 GB of
# pinned shmem, zram swap in use) and kcompactd kept defragmenting memory on
# its own: 10-22 % of a core, ~8 million pages scanned per 20 s. Measured on
# the tablet (The Complex, 2026-11-17): 10 % with the default 20, 0 % with 0.
# Compaction still happens when an allocation needs it.
vm.compaction_proactiveness = 0
