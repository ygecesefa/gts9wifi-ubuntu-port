# Point hexagonrpcd at this tablet's HexagonFS tree and start the sensor
# protection domain only once the DSP is up, the registry tree is normalised
# and the panel cold-boot recovery (which runs a suspend cycle) has returned:
# starting it inside that cycle is what hung the SoC on the Fedora port.  One
# attempt per boot; a failed attach must not loop, because audio shares the
# ADSP.  The daemon is confined to -R and never sees the real persist.
[Unit]
Requires=gts9wifi-adsp-boot.service gts9wifi-sensor-registry.service
After=gts9wifi-adsp-boot.service pd-mapper.service gts9wifi-sensor-registry.service
After=gts9wifi-panel-coldboot-recover.service

[Service]
ExecStart=
ExecStart=/usr/bin/hexagonrpcd -f /dev/fastrpc-adsp -d adsp -s -R /usr/share/qcom/sm8550/Samsung/gts9wifi
Restart=no
