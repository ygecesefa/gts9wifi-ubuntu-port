# Waydroid binds the host's /vendor/lib64/egl (and /vendor/odm) into the
# container whenever it exists, for Halium hosts where Android's GPU driver
# is usable.  Here /vendor is Samsung's Android vendor partition, mounted
# read-only for firmware: the container got Qualcomm's Android-only Adreno
# EGL instead of its own Mesa, and surfaceflinger aborted ("couldn't find an
# OpenGL ES implementation").  Hide /vendor from the container manager
# only; the rest of the system still sees it.
[Service]
TemporaryFileSystem=/vendor:ro
