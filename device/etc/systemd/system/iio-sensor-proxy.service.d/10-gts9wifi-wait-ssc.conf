# The sensors sit behind the ADSP.  udev starts iio-sensor-proxy as soon as
# /dev/fastrpc-adsp appears, which is before the sensor protection domain has
# published the SSC QMI service; the daemon then finds nothing and exits.
[Unit]
After=hexagonrpcd-adsp-sensorspd.service

[Service]
ExecStartPre=/usr/libexec/gts9wifi-wait-ssc
