[Service]
# A suspend overlapping the ADSP start froze the SoC on this board (Fedora
# port, with panel-coldboot-recover's pm_test cycle; ordering handles that
# one).  A power-key suspend in the first minute after boot would be the same
# race, so hold a sleep block from the start request until /dev/fastrpc-adsp
# exists (the ADSP is up), replacing the separate ExecStartPost wait.
ExecStart=
ExecStart=/usr/bin/systemd-inhibit --what=sleep --mode=block --who=gts9wifi-adsp-boot --why="ADSP firmware is starting" /bin/sh -c 'grep -q running /sys/class/remoteproc/remoteproc0/state || echo start > /sys/class/remoteproc/remoteproc0/state; i=0; while [ $i -lt 60 ] && [ ! -e /dev/fastrpc-adsp ]; do sleep 1; i=$((i+1)); done'
ExecStartPost=
