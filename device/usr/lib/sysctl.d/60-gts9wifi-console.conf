# Only crit and above go to the consoles (dmesg keeps everything).  The
# kernel console includes ttyMSM0 at 115200 baud with nothing attached, and
# messages queued during suspend are written out before tasks thaw: a burst
# of i2c errors on a double-tap wake held the screen back by ~0.9 s.
kernel.printk = 3 4 1 7
