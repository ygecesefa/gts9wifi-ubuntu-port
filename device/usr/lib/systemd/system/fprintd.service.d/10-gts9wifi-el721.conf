# EL721 under-display reader (adapted from the S9 Ultra port's drop-in).
[Unit]
Wants=gts9wifi-fingerprint-secure.service
After=gts9wifi-fingerprint-secure.service

[Service]
ExecStartPre=/usr/libexec/gts9wifi-fingerprint-secure --wait
TimeoutStartSec=75
# fprintd's stock sandbox permits USB, SPI and hidraw only; open exactly the
# devices the EL721 path uses: QTEE, the K250A (HwVault rebuilds its key
# cache from it) and the sensor's power companion.
DeviceAllow=/dev/tee0 rw
DeviceAllow=/dev/k250a rw
DeviceAllow=/dev/esfp0 rw
# Device-local Gatekeeper identity, outside fprintd's per-user print store.
StateDirectory=gts9wifi/fingerprint/state
StateDirectoryMode=0700
# Publicly readable lease for the waiting icon; no biometric data.
RuntimeDirectory=gts9wifi-fingerprint
RuntimeDirectoryMode=0755
