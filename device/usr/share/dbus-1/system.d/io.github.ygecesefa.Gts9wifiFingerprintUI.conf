<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="io.github.ygecesefa.Gts9wifiFingerprintUI"/>
  </policy>
  <policy context="default">
    <!-- The broker validates UID and the active local session on every call. -->
    <allow send_destination="io.github.ygecesefa.Gts9wifiFingerprintUI"
           send_interface="io.github.ygecesefa.Gts9wifiFingerprintUI" send_member="Pulse"/>
    <allow send_destination="io.github.ygecesefa.Gts9wifiFingerprintUI"
           send_interface="io.github.ygecesefa.Gts9wifiFingerprintUI" send_member="Presented"/>
    <allow send_destination="io.github.ygecesefa.Gts9wifiFingerprintUI"
           send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
